[package]
name = "androforge-studio"
version = "1.0.0"
description = "AndroForge Studio — Professional HTML-to-Android APK & AAB Builder, Rebuilder & API 36 Upgrade Tool"
authors = ["AndroForge Studio Contributors"]
license = "Apache-2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.1.0", features = ["protocol-asset"] }
tauri-plugin-shell = "2.0.0"
tauri-plugin-dialog = "2.0.0"
tauri-plugin-fs = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32.1", features = ["bundled"] }
zip = "2.2.0"
sha2 = "0.10.8"
